title: NHS England awards separate privacy-enhancing technology contract to IQVIA
summary: >-
  Alongside the Federated Data Platform award, NHS England awarded a
  separate contract to IQVIA to provide privacy-enhancing technology (PET),
  intended as an additional safeguard for data used in the FDP and other
  NHS data platforms.
