title: Palantir awarded two-year, up to £23.5m COVID-19 Data Store contract
summary: >-
  NHS England awarded Palantir a new contract, worth up to £23.5m over two
  years, to continue running the COVID-19 Data Store. The deal widened the
  platform's scope beyond the pandemic response, despite earlier assurances
  that the datastore would be unwound and any extension put to public
  tender.
