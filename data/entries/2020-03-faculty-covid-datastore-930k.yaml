title: Faculty contracted for £930,000 to support NHSX AI Lab's COVID response
summary: >-
  Faculty, an AI firm whose director Ben Warner had worked on the Vote Leave
  campaign's data operation, was contracted to provide short- and long-term
  forecasting on COVID-19's spread and impact on NHS resources, and strategic
  support to the NHSX AI Lab. The published contract valued the work at
  £930,000.
