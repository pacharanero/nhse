id: 2020-03-palantir-covid-datastore-1-pound
date: 2020-03-01
date_precision: month
category: contract
title: Palantir contracted to build NHS COVID-19 Data Store for £1
summary: >-
  Palantir Technologies UK was contracted to provide data integration work
  on the NHS COVID-19 Data Store using its Foundry software, for a nominal
  fee of £1. The contract listed NHS Arden & GEM CSU as the buyer and covered
  ingestion and integration of agreed data sources, Foundry configuration,
  and user training.
