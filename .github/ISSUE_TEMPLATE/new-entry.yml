name: Propose a timeline entry
description: Suggest a dated, sourced event for the FDP timeline (or another topic in this repo).
title: "[entry] "
labels: ["new-entry"]
body:
  - type: markdown
    attributes:
      value: >-
        Spotted something that belongs on the timeline? Give us a link and
        whatever you know about it below - a sentence is fine, you don't
        need to fill in every detail. We'll do the rest (dating it,
        archiving the source, categorising it, writing it up).

        Prefer to write it up yourself? See the
        [contributor guide](https://github.com/pacharanero/nhse/blob/main/CONTRIBUTING.md)
        for the full entry schema and editorial policy.
  - type: input
    id: link
    attributes:
      label: Link
      description: A URL to the source - an article, document, tweet, whatever you've got.
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: What's this about?
      description: >-
        Whatever you know. All of this is optional - include what you have,
        skip what you don't:
          - What happened, and when (even roughly)?
          - A quote, if there is one worth capturing
          - Who said or did it
          - Anything you've seen disputing or denying it
      placeholder: |
        e.g. "NHS England awarded the FDP contract to Palantir, around
        21 November 2023. Foxglove and some doctors' groups objected."
    validations:
      required: false
