    archive_url: https://web.archive.org/web/20260325183240/https://www.gov.uk/government/publications/2025-to-2026-revised-financial-directions-to-nhs-england
  - id: nhs-england-accounts-2025-26
    title: NHS England annual report and accounts 2025 to 2026
    url: https://www.gov.uk/government/publications/nhs-england-annual-report-and-accounts-2025-to-2026
    archive_url: https://web.archive.org/web/20260903103558/https://www.gov.uk/government/publications/nhs-england-annual-report-and-accounts-2025-to-2026
  - id: supplementary-estimates-2025-26
    title: Supplementary Estimates 2025-26
    url: https://www.gov.uk/government/publications/supplementary-estimates-2025-26
