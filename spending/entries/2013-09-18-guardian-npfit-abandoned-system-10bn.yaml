title: PAC reports abandoned NHS IT programme has cost £9.8bn, final bill still rising
summary: >-
  Parliament's Public Accounts Committee reported that the abandoned National
  Programme for IT had so far cost £9.8 billion against an original £6.4
  billion estimate at the point of abandonment in 2011, with the final bill
  expected to rise further. The Lorenzo care records system, originally
  contracted at £3.1bn to cover 220 trusts, was by this point expected to
  cost the Department of Health £2.2bn to cover only 22 trusts - and, a
  decade after the original 2002 contract, "not a single trust has a fully
  functioning Lorenzo care records system". Separately, the Department's
  legal costs disputing compensation after terminating Fujitsu's contract in
  2008 had already reached £31.5m.
quote: "This saga is one of the worst and most expensive contracting fiascos in the history of the public sector."
