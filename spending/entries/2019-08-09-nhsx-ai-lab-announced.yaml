title: Health secretary announces £250m NHSX "National Artificial Intelligence Lab"
summary: >-
  Health and social care secretary Matt Hancock announced plans to invest
  around £250 million in a new "National Artificial Intelligence Lab" housed
  within NHSX, the body overseeing digitisation of the English health
  service, intended to help identify and treat disease more rapidly. The BMJ
  reported that health experts warned at the time that such technology must
  be properly evaluated and standards agreed before wide adoption, and that
  NHS staff would need the digital skills to use it.
source_url: https://www.bmj.com/content/366/bmj.l5106
source_title: "The BMJ: Government pins hopes on £250m AI centre for faster diagnosis and treatment"
