title: NAO reports £6.4bn spent on National Programme for IT care records systems
summary: >-
  The National Audit Office reported that by 31 March 2011 the Department of
  Health had spent some £6.4 billion on the National Programme for IT's
  detailed care records systems, and estimated it would cost at least a
  further £220 million to get the delivered systems to work together. The
  NAO concluded the original vision for the Programme would not be realised:
  the NHS was getting far fewer systems than planned despite the Department
  paying contractors almost the same amount of money originally budgeted.
