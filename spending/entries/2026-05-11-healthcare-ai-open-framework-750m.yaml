title: NHS Shared Business Services opens £750m-£900m Healthcare AI Solutions framework
summary: >-
  NHS Shared Business Services Limited published a Find a Tender notice for
  an open framework for "Healthcare AI Solutions", with an estimated total
  value of £750,000,000 excluding VAT (£900,000,000 including VAT) across
  eight lots covering radiology/imaging, pathology and early detection,
  virtual and robotic health, predictive analytics, R&D, operational
  efficiency, advisory services, and combined solutions. The framework runs
  for an estimated 8 years (12 May 2027 to 11 May 2035), with no cap on the
  number of suppliers, and NHS SBS applies a levy of up to 0.90% on sales
  made under it. The tender submission deadline was 23 June 2026, with an
  estimated award decision date of 19 March 2027.
source_url: https://www.find-tender.service.gov.uk/Notice/043057-2026
