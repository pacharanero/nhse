# NHS Digital (formerly the Health and Social Care Information Centre, HSCIC)
# published its own "spend information" series on digital.nhs.uk, separately
# from NHS England's own payments-over-£25,000 publication, until NHS Digital
# merged into NHS England on 1 February 2023. Every digital.nhs.uk source_url
# below now 404s; archive_url (UK Government Web Archive) is the only live
# route. See spec/spending-data.md for why this registry, and its built
# releases, are kept separate from spending/data-sources.yaml.

