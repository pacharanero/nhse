# Lightweight sibling to fdp/entries/*.yaml - not full timeline entries,
# just a dated log of episodes that touch on the FDP or Palantir's wider
# NHS role, for charting them as a small dot on the timeline rather than
# a full card. See CONTRIBUTING.md "Appearance trackers". Every episode
# here is self-published (the show's own channel), so self is always
# true - this tracker isn't distinguishing self vs earned media the way
