title: Rewired 2023 debate speakers raise doubts about Palantir's FDP bid
summary: >-
  A debate closing Digital Health's Rewired 2023 conference examined
  whether NHS England's Federated Data Platform procurement, then
  expected to be worth up to £480m, risked awarding the contract to an
  already-favoured incumbent. Speakers Cori Crider (Foxglove co-founder)
  and Marcus Baw (clinical informatics and GP IT consultant) argued the
  tendering process gave Palantir a structural advantage from its
  earlier no-cost COVID-19 work, questioned Palantir's suitability as a
  custodian of NHS data given its intelligence and security-sector work,
  and criticised the FDP's rationale as vague; Palantir's UK head Louis
  Mosley had been due to speak but withdrew, represented instead by a
  cardboard cut-out. NHS England declined to take part. Earlier the same
  day, NHS England's director of digital transformation Tim Ferris told
  the conference in his keynote that whichever supplier won would
  provide software only, not data ownership. Digital Health's own report
  characterised the FDP's purpose at this point as "primarily a data
  analytics platform... not intended to directly support patients' care."
  An audience vote at the debate's close found an overwhelming majority
  unconvinced the FDP was the best route to patient benefit.
quote: "I'm very committed to open source [data]. So, it obviously hurts me to see such a big investment in essentially a closed source platform."
