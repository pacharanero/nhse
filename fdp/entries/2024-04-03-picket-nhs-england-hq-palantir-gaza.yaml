contested: >-
  Palantir CEO Alex Karp said he disagreed with co-founder Peter Thiel's
  comments about the NHS, made in a "private" capacity. Karp told the
  BBC's Sunday With Laura Kuenssberg in October 2023: "We're the only
  company of our size and scale that doesn't buy your data, doesn't sell
  your data, doesn't transfer it to any other company. That data belongs
  to the Government of the United Kingdom."
