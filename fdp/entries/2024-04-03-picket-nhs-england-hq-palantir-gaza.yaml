title: Pro-Palestinian medical activists picket NHS England HQ over Palantir's Israel ties
summary: >-
  More than 100 health workers, patients and allies picketed NHS England's
  headquarters in Waterloo, London, demanding the Palantir FDP contract be
  cancelled over the company's work supplying military and surveillance
  technology to the Israeli government, amid the Israel-Gaza war.
quote: "Data experts, senior politicians and NHS medics have warned the seven-year Palantir deal with the NHS could 'undermine public trust' if patient data was mishandled."
quote_verified: document
source_url: https://www.dailymail.com/news/article-13266689/Pro-Palestinian-medics-blockade-NHS-England-Israel-military.html
source_title: "Daily Mail: Pro-Palestinian medics blockade entrance to NHS England's headquarters and demand health service cancels contract with firm they claim supplies tech to Israel's military"
archive_url: https://web.archive.org/web/20261006131707/https://www.dailymail.com/news/article-13266689/Pro-Palestinian-medics-blockade-NHS-England-Israel-military.html
