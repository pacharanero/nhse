title: NHS England publishes Prior Information Notice for Federated Data Platform
summary: >-
  NHS England published a Prior Information Notice announcing plans to
  procure a Federated Data Platform (FDP) to replace the COVID-19 Data
  Store, estimating a contract value of £240m across five use cases:
  population health and person insight, care coordination, elective
  recovery, vaccines and immunisation, and supply chain.
