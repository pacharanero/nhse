title: Investigation reveals Palantir's £30k/month Mandelson lobbying operation, codenamed "Project Onion"
summary: >-
  Democracy for Sale (Peter Geoghegan and Lucas Amin), in an investigation
  also published in the London Review of Books, revealed that Palantir
  hired Peter Mandelson's lobbying firm Global Counsel in 2018 to position
  it as "a respectable partner to the British government," on a retainer
  worth over £30,000 a month, run under the internal code name "Project
  Onion." The investigation reported that Global Counsel exploited gaps in
  UK lobbying registration rules to avoid declaring Palantir as a client,
  and that a rival bidder for the FDP contract, Shane Tickell, said Palantir
  "had all these people to open doors and lobby and pitch long before the
  procurement started." The same investigation found that NHS usage data
  obtained by FOI showed 52 of 139 "live" trusts had not used a single one
  of the FDP's eight apps in the twelve months to June 2026, and that the
  flagship Cancer 360 tool was used by only six trusts.
quote: "For Palantir, the NHS was the holy grail. Years of lobbying tilted the FDP tender in Palantir's favour."
