contested: >-
  Palantir's head of UK corporate affairs, Ben Mascall, told the
  journalists the company is merely a software provider: "How that
  software is used is controlled by the NHS trusts who use it, with data
  - legally and contractually - only able to be processed strictly in
  accordance with their instructions." NHS England did not answer the
  piece's specific questions but said "NHS England has always been clear
  that the published benefits are a comparison of performance before and
  after the adoption of the platform." No response is recorded from
  Matthew Swindells or Topham Guerin specifically. The LRB gives neither
  the Swindells nor the Topham Guerin story a precise date (just "earlier
  this year" for the former), but both are now dated and fully sourced as
  their own entries: 2026-03-05-swindells-palantir-conflict-of-interest-resigns
  (FT, 5 and 17 March 2026) and
  2024-01-02-topham-guerin-palantir-influencer-campaign-exposed (Good Law
  Project, 2 and 6 January 2024 - predating this LRB piece by over two
  years; the LRB appears to be recapping it as scene-setting context
  rather than reporting something new). The same pattern applies to the
  Greater Manchester and Leeds quotes on declining to adopt the FDP: The
  Register reported near-identical positions from both trusts (plus
  Berkshire Healthcare) on 16 May 2025, over a year before this LRB piece
  - see 2025-05-16-register-trusts-doubt-fdp-utility, which also traces
  the Greater Manchester/Berkshire quotes to an even earlier Democracy
  for Sale piece not yet added to this repo. The LRB's quotes (Leeds
  "would lose functionality rather than gain it," Matt Hennessey telling
  the Health and Social Care Select Committee NHS Greater Manchester "can
  match anything the Palantir FDP can do") may be fresher restatements of
  the same long-held positions rather than new findings - not confirmed
  either way here. The same FOI-derived findings were first reported
  through the [Financial
  Times](https://www.ft.com/content/a3e94197-87a8-4ba5-8a6d-4b7193993af9)
  and re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2026/06/ft-analysis-suggests-fdp-benefits-are-very-uneven/)
  ([archive](https://web.archive.org/web/20260617032106/https://www.digitalhealth.net/2026/06/ft-analysis-suggests-fdp-benefits-are-very-uneven/)).
