contested: >-
  Kogan told the Guardian the $500,000 figure Rust and colleagues sought was
  not warranted in SCL's view and that he tried to find a "middle road"
  before SCL asked him to remove Kosinski and Stillwell from the project.
  Cambridge University said it commissioned external legal advice on the
  IP dispute and that Kogan signed a legal assurance that no university
  data, models or software had been or would be used for the benefit of
  SCL.
