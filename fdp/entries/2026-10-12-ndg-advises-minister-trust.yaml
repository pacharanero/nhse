title: National Data Guardian advises minister that trust should carry substantial weight in FDP decision
summary: >-
  In a letter dated 9 October 2026 and published 12 October, National Data
  Guardian Dr Nicola Byrne advised the Minister for Health Innovation,
  James Frith, that "the 'trust factor'" should be given substantial
  weight in decisions about the FDP's future, including how it is
  delivered and how its benefits are evidenced and communicated. Her
  advice does not recommend a particular contractual outcome. She set out
  three recommendations: give public and professional trust substantial
  weight when evaluating any supplier of a system involving health and
  care data; ensure decisions are supported by clear, objective evidence
  of benefits and limitations, communicated transparently, within a
  culture open to challenge; and address concerns about interoperability,
  vendor lock-in and data sovereignty, including considering open
  standards and open-source technology. The accompanying annex cites a
  recent National Data Opt-Out rise coinciding with media coverage of the
  FDP and its supplier, and
  [research for Understanding Patient Data](https://www.understandingpatientdata.org.uk/sites/default/files/2026-07/Health%20data%20in%20the%20headlines%20-%20Changing%20media%20landscape.pdf)
  finding 84% of 243 Palantir/FDP-related articles (of 1,329 health-data
  articles analysed, March 2025-June 2026) were negative in tone.
quote: "Whatever decision is taken about the current supplier, the FDP programme must command sufficient public and professional trust. This is important not only to the future of the FDP, but to wider trust in how the NHS uses people's data."
