title: Guardian reveals secret 2019 meeting between Johnson, Cummings and Palantir's Peter Thiel
summary: >-
  A cache of leaked government documents - the "Boris Files", obtained by
  Distributed Denial of Secrets and reviewed by the Guardian - showed
  prime minister Boris Johnson and his adviser Dominic Cummings held an
  hour-long meeting with Palantir co-founder Peter Thiel in Downing
  Street on 28 August 2019, a year before Palantir's first NHS COVID-19
  Data Store contract. The meeting was marked "private" in Johnson's own
  activity log and was never disclosed on the government's public
  register of ministerial meetings, raising questions about compliance
  with the ministerial code's transparency requirements. Thiel, a major
  Palantir shareholder, has separately accused the NHS of making people
  sick and said the UK has "Stockholm syndrome" over the health service.
source_url: https://www.theguardian.com/uk-news/2025/sep/08/boris-johnson-dominic-cummings-secret-meeting-palantir-peter-thiel
