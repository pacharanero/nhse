contested: >-
  Johnson did not respond to repeated requests for comment about the
  Thiel meeting specifically. His only subsequent statement, issued after
  publication, addressed a separate and unrelated allegation (misuse of
  the public duty costs allowance) and did not confirm or deny the
  meeting. Thiel did not respond to repeated requests for comment either.
