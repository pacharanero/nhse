title: Science, Innovation and Technology Committee urges government to exercise FDP break clause
summary: >-
  A cross-party report by the Commons Science, Innovation and Technology
  Committee named Palantir as the most concerning example of the public
  sector's reliance on a small number of major technology providers, and
  urged the government to exercise the February 2027 break clause in the
  FDP contract and either develop an in-house replacement or seek an
  alternative UK provider.
quote: "A critical part of this transformation should include reducing the UK's dependence on a small number of big US tech companies like Palantir. Vendor lock-in isn't inevitable, and the current position leaves us seriously exposed."
