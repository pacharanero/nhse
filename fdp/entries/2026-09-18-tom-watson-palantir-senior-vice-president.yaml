title: Tom Watson joins Palantir as UK senior vice-president, having advised the company since 2024
summary: >-
  Lord Watson of Wyre Forest - formerly Tom Watson MP for West Bromwich
  East (2001-2019) and Labour's deputy leader (2015-2019), made a life
  peer on 21 November 2022 - took up a senior vice-president role at
  Palantir, working alongside UK and Europe chief executive Louis
  Mosley. He had already been a paid part-time adviser to the company
  since 2024, as a member of its Public Services Advisory Board, before
  this full-time appointment; since leaving Parliament in 2019 he had
  also advised the gambling and music industries. Palantir said Watson
  would help "deepen the social and economic value its work creates
  through better British public services, jobs and skills." He took a
  leave of absence from the House of Lords and relinquished his
  parliamentary pass for the duration of the role. The appointment came
  as Palantir's £330m NHS contract faced review and the company fought
  Sadiq Khan in court over a blocked £50m Metropolitan Police deal.
quote: "Since stepping down from parliament in 2019, Watson has been an adviser to the gambling and music industries and, since 2024, he has been a part-time adviser to Palantir, including accompanying [Mosley to meetings]."
