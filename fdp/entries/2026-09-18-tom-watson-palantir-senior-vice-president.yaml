contested: >-
  Coverage at the time of appointment largely framed this as a new
  hire; the "since 2024" advisory role - confirmed independently via
  the official Register of Lords' Interests, which lists him as
  "Member, Public Services Advisory Board, Palantir UK Ltd" - means his
  paid relationship with the company predates this full-time
  appointment by roughly two years, running concurrently with part of
  his time as a sitting peer.
