title: National Data Guardian names Palantir in further advice on FDP public trust
summary: >-
  Ahead of the contract award, National Data Guardian Dr Nicola Byrne
  published a second blog on transparency, communication and public trust,
  noting that public discourse about one of the then-potential commercial
  suppliers, Palantir, was "particularly contentious." Drawing on public
  engagement and research, she set out conditions she said need to be met
  for the public to support commercial involvement in NHS data: authentic
  communication and transparency, a clear rationale for commercial
  involvement, proof the external organisation is trustworthy, a
  demonstrable public benefit that outweighs the commercial one, and
  adequate safeguards against improper use. She warned that failure to
  maintain public trust could contribute to a rise in National Data
  Opt-Out rates.
