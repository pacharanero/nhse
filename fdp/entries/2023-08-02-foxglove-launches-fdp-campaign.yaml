title: Foxglove launches "Email your MP" campaign against FDP procurement
summary: >-
  Foxglove launched a public campaign urging people to email their MP and
  ask them to read its report on the FDP procurement's risks, aiming to get
  Parliament to scrutinise the deal before the contract award, due the
  following month. A YouGov poll commissioned alongside the campaign found
  48% of adults in England who had not yet opted out said they would be
  likely to if the FDP were run by a private company like Palantir.
quote: "The apparent failure of Foundry at multiple NHS trusts badly needs Parliamentary scrutiny. The contract winner for this £480m system is due to be announced in September. The window is closing, but it isn't yet shut."
quote_verified: document
source_url: https://www.digitalhealth.net/2023/08/foxglove-launches-campaign-against-fdp-but-palantir-hits-back/
