contested: >-
  A Palantir spokesperson told Digital Health News the company was "proud"
  of its NHS COVID-19 work and of helping reduce care backlogs, citing a
  28% waiting list reduction and 13% increase in theatre utilisation at
  Chelsea and Westminster NHS Foundation Trust, and said it does not
  collect, mine, or sell data, only providing tools whose use is dictated
  by the customer. Palantir CEO Alex Karp separately said he disagreed
  with co-founder Peter Thiel's "Stockholm syndrome" remarks about the NHS.
