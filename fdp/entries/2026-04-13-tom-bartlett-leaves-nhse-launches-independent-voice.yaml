title: Tom Bartlett leaves NHS England FDP role, launches as independent FDP commentator
summary: >-
  Tom Bartlett, who led the roughly 150-person team that built the FDP's
  data engineering layer as NHS England's deputy director of data
  engineering, announced on LinkedIn that he had left the organisation
  "last month" and was publishing his first piece "as an independent
  voice" defending the platform against what he called a mischaracterised
  public debate. His company,
  [Bartlett Data Ltd](https://web.archive.org/web/20261013074837/https://find-and-update.company-information.service.gov.uk/company/16992631),
  had been incorporated on 27 January 2026 - roughly ten weeks before this
  public departure announcement, and while he was, on his own account,
  still at NHS England. A commenter asked directly under the post whether
  it had been "written with support from sales/marketing at Palantir."
quote: "I spent 22 years building data systems inside the NHS. The last three and a half of those leading the team that built the Federated Data Platform at NHS England. I left last month. I've been watching the public debate about FDP since and I don't recognise the platform being described. I've written my first piece as an independent voice."
