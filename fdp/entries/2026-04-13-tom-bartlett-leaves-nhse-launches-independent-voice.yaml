contested: >-
  LinkedIn posts are not reliably archivable by archive.org or
  archive.today (login-walled, JavaScript-rendered) - no existing
  capture was found on either, and a fresh archive.org save attempt
  failed (HTTP 523). The post's full text, including the comment below,
  is retained at fdp/sources/2026-04-13-tom-bartlett-linkedin-debut-post.md
  as the archive record instead. Asked directly in the comments under
  this post whether it had been "written with support from
  sales/marketing at Palantir," Bartlett did not reply in the visible
  comment thread. His formal published bio, distributed via Computer
  Weekly's parent TechTarget, states: "As an independent consultant, Tom
  has no relationship or association with NHS England or Palantir, the
  supplier of the software that underpins FDP." No evidence of paid or
  coordinated support from either organisation has been found; the
  ten-week gap between incorporating Bartlett Data and announcing his
  departure from NHS England, and the rapid subsequent media uptake (see
  related entries), are recorded here as factual context, not as
  evidence of coordination.
