title: Westminster Hall debates the FDP, MPs press for the break clause
summary: >-
  Martin Wrigley MP (Newton Abbot) led a Westminster Hall debate on the
  FDP, arguing the contract delivers no software or intellectual property
  to the NHS - only a subscription service with total vendor lock-in - and
  pressing the minister to use the February 2027 break clause rather than
  extend it. Multiple MPs raised the Good Law Project's redaction finding
  (417 of 586 contract pages blanked out), Peter Thiel's "freedom and
  democracy are not compatible" remarks, and Palantir CEO Alex Karp's
  "on occasion kill them" earnings-call quote. Kim Johnson MP raised
  unminuted 2019 meetings between Boris Johnson, Dominic Cummings and
  Peter Thiel, and a 2025 visit to Palantir's offices by Peter Mandelson
  and the Prime Minister, calling for both to be made public.
quote: "The current contract delivers a subscription service that leaves no deliverables after the subscription - no software, no improvements and no intellectual property after spending more than £330 million. All the specially written software and intellectual property rights belong to the supplier, says the contract."
