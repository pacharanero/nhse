contested: >-
  Ahmed also defended the FDP's governance and reported benefits, saying
  NHS organisations remained data controllers and Palantir a processor.
  Those statements answer the debate's wider criticism but do not settle
  the specific vendor-lock-in and intellectual-property claims quoted
  above. Re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2026/04/palantirs-nhs-contract-could-end-if-others-can-do-the-job-better/)
  on 17 April 2026; no exact archive of that report was verified.
