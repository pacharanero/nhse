contested: >-
  In his 21 August response, minister James Frith said commercial, legal
  and continuity work would finish in autumn, that a successor procurement
  was unlikely to complete by March, and that NHS England owned the
  project-specific intellectual property, canonical data model and
  NHS-developed products needed for replatforming. This was the
  government's position that the NHS was not locked into Palantir; it did
  not remove the committee's and witnesses' concerns about the practical
  time and cost of transition. Digital Health also [reported on 14
  July](https://www.digitalhealth.net/2026/07/pressure-mounts-from-mps-on-palantirs-role-in-the-nhs/)
  that NHS England chief executive Jim Mackey questioned whether its
  benefit assessments were fully objective, but the primary record for
  that exact wording was not located. Frith's response was analysed and
  re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2026/09/nhs-in-a-great-place-to-ditch-palantir-despite-health-ministers-claim/);
  no exact archive of either report was verified.
