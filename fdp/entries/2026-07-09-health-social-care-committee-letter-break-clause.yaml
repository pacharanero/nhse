title: Health committee urges minister not to extend Palantir's FDP contract
summary: >-
  The Health and Social Care Committee wrote to Health Innovation Minister
  Preet Kaur Gill recommending that the government not extend Palantir's
  contract when its initial term ends in 2027, citing public mistrust of
  Palantir, doubts about the platform's effectiveness, and the existence of
  alternative solutions. The letter supported continued NHS digital
  transformation, including through the FDP, but argued that better tools
  should be developed and rolled out instead of extending the agreement
  with Palantir. It also noted NHS England had clarified that it could not
  say the FDP caused its reported waiting-list and procedure improvements
  because other variables were not controlled for.
quote: "Little by little, the government's arguments for sticking with the FDP has unravelled. So in the interest of public confidence in the NHS and the security of their medical information, we believe it is time to crack on with preparations to find an alternative in time for spring 2027."
