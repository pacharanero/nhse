title: Health and Social Care Committee tells minister to drop Palantir and find an alternative
summary: >-
  The Health and Social Care Committee wrote to Health Innovation Minister
  Preet Kaur Gill recommending NHS England drop the FDP when its February
  2027 break clause comes up, citing public mistrust of Palantir, doubts
  about the platform's effectiveness, and the existence of alternative
  solutions. The letter noted NHS England had published claims the FDP
  had cut waiting lists and increased procedure numbers, but had since
  clarified it could not say the platform caused those changes, as other
  variables were not controlled for.
quote: "Little by little, the government's arguments for sticking with the FDP has unravelled. So in the interest of public confidence in the NHS and the security of their medical information, we believe it is time to crack on with preparations to find an alternative in time for spring 2027."
