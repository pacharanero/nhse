title: Computer Weekly begins Tom Bartlett's "Inside FDP" column series
summary: >-
  Seventeen days after his debut LinkedIn post announcing he had left NHS
  England, Tom Bartlett's "Inside FDP" column series began running in
  Computer Weekly, trade press for the UK IT industry owned by the same
  publisher (TechTarget/Informa) as several other outlets that went on to
  feature him. The first five parts ran roughly weekly (30 April, 7, 14,
  21 and 28 May 2026), followed by three further instalments through to
  2 October 2026. Computer Weekly's contributor page for Bartlett
  describes him, without qualification, as an independent consultant
  with "no relationship or association with NHS England or Palantir."
  Bartlett Data's own website separately lists The Economist, WIRED UK,
  Sky News, the Financial Times, the Daily Mail, the Guardian, CityAM,
  the Telegraph, the BBC and HSJ, alongside Computer Weekly, under
  "Featured in."
