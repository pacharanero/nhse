title: Good Law Project launches legal action over Palantir's heavily redacted FDP contract
summary: >-
  Good Law Project launched legal action against NHS England after the
  published version of the £330m Palantir FDP contract turned out to have
  417 of its 586 pages completely blanked out, with no reasons given for
  the redactions as government policy requires. A later update (19 March
  2024) found NHS England was still negotiating contractual provisions,
  including clauses on data protection, after the contract had already
  been awarded and signed.
quote: "Almost three quarters of the contract between the tech giant and the NHS is completely blanked out. It's time to see what it's hiding."
