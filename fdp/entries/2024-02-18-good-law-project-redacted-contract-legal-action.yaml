contested: >-
  The stable ID retains 18 February, but the dated Good Law Project launch
  page displays 17 February and the entry date now follows that source.
  The action began with a pre-action protocol letter, not a court judgment.
  NHS England later committed to republish the contracts with fewer
  redactions, aiming for a non-firm two-week timetable while disputing Good
  Law Project's legal analysis and saying republication was already
  planned. The target passed before a 21 March replacement notice and Good
  Law Project's 28 March confirmation that less-redacted contracts had
  appeared. Its 19 March update also alleged that contractual provisions,
  including data protection clauses, were still being negotiated after
  signature. These developments appear as updates on the entry's main
  Good Law Project source page. The action was re-reported by
  digitalhealth.net on [20
  February](https://www.digitalhealth.net/2024/02/good-law-project-sues-nhse-over-heavily-redacted-palantir-fdp-contract/),
  [5
  March](https://www.digitalhealth.net/2024/03/nhse-to-republish-palantir-patient-data-contract-with-fewer-redactions/)
  and [20
  March](https://www.digitalhealth.net/2024/03/nhse-misses-deadline-to-upload-less-redacted-version-of-palantir-contract/)
  2024; no exact archives of those reports were verified.
