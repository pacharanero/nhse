contested: >-
  Archive.org has repeatedly failed to capture this WhatDoTheyKnow page
  (HTTP 520 on every save attempt, including from a different IP),
  despite other pages on the same domain - including the near-identical
  DHSC request - archiving normally. This looks like a targeted block on
  archive.org's crawler rather than a transient fault. The source PDF
  and a full transcript of the FOI correspondence are retained in
  fdp/sources/ as the archive record instead; see
  fdp/sources/2026-foi-nhse-weekly-trust-users-by-product.md for the
  detail of why.
