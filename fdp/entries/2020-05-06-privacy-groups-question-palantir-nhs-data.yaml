title: Privacy groups' questions to Palantir expose gap between "aggregate" claims and reported datastore contents
summary: >-
  Privacy International, Big Brother Watch, medConfidential, Foxglove and
  Open Rights Group sent Palantir ten questions about its role in the NHS
  COVID-19 Data Store, after the Guardian reported on 12 April 2020 that
  the project included "large volumes of data pertaining to individuals,
  including protected health information, Covid-19 test results, the
  contents of people's calls to the NHS health advice line 111 and
  clinical information about those in intensive care." Palantir's written
  response (29 April 2020) described itself only as a data processor
  acting on NHS instructions, declined to clarify whether it would access
  identifiable patient records, and pointed questions about scope back to
  the NHS. The coalition noted that while the NHS COVID-19 Data Store's
  own public reference library described 111 and 999 call data as
  "aggregate," the Guardian's reporting said confidential 111 call
  information could include gender, postcode, symptoms and the precise
  time a call ended, cross-matched via a "pseudo NHS number" against a
  national master patient index.
quote: "any access to customer data under any circumstances would be strictly at the direction of customers, in support of legitimate purposes, and in adherence with all applicable rules and regulations"
