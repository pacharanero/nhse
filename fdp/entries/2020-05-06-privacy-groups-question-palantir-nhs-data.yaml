contested: >-
  Palantir's response states it merely "serves as a technical agent to
  its customers" and directs questions about patient-record access back
  to the NHS; the coalition considered this response to "offer some
  assurances" while "failing to clarify the extent of the project and
  what protections exist." Neither the NHS nor NHSX responded to the
  underlying scope questions within this piece.
