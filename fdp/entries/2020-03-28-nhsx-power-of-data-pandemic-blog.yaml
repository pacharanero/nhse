title: NHSX announces the COVID-19 Data Store, promises it will be closed after the pandemic
summary: >-
  NHSX chief executive Matthew Gould, NHSX director of AI Indra Joshi, and
  NHS England director of data and analytics Ming Tang announced the
  COVID-19 Data Store in a joint GOV.UK blog post: a backend store (built
  on Microsoft Azure) feeding a Palantir Foundry-powered front end, to
  bring together NHS data "to understand and anticipate demand" during
  the pandemic. The post states "all NHS data in the store will remain
  under NHS England and NHS Improvement's control" and that "when the
  pandemic abates and the outbreak is contained, we will close the
  Covid-19 datastore," with data processing agreements requiring partners
  to destroy or return data once the emergency ends. It describes
  Palantir as "a data processor, not a data controller," unable to "pass
  on or use the data for any wider purpose without the permission of NHS
  England," and Google's exploratory role as limited to "aggregated
  operational data only... It will not include any form of identifiable
  patient data."
quote: "When the pandemic abates and the outbreak is contained, we will close the Covid-19 datastore."
