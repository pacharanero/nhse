title: Palantir CEO Karp tells investors the company will "on occasion kill" enemies
summary: >-
  On Palantir's Q4 2024 earnings call, CEO Alex Karp told investors:
  "Palantir is here to disrupt and make the institutions we partner with
  the very best in the world and, when it's necessary, to scare enemies and
  on occasion kill them." Karp is CEO of the company leading the FDP
  consortium; the remark is recorded here as material context on the
  company holding the contract, not as an FDP-specific event.
