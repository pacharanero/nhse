title: Board told opt-out rate after FDP award "has not really materialised as much as we feared"
summary: >-
  Asked by a board member what the impact on care would be for patients who
  opt out of data sharing, Ming Tang told the board that opt-outs saw "a
  slight peak" around the FDP award announcement, driven by social media
  activity from Foxglove and other privacy campaigners, but that the
  opt-out rate had not risen as much as NHS England had feared. She went on
  to say NHS England's messaging had been designed so patients would
  understand that, for direct care, opting out was "not in their interest"
  and "unlikely" - while confirming they technically still could. Nearly
  two and a half years later, the government confirmed the National Data
  Opt-Out does not apply to FDP products at all, because the relevant
  processing is classified as direct care - the opt-out Tang described as
  merely discouraged had, by then, become one most patients had no formal
  mechanism to exercise for this purpose in the first place. This is the
  same meeting referenced in the spec's caption-reliability note: the
  auto-captions render "opt-outs" as "ops out" partway through this
  exchange, while rendering it correctly elsewhere in the same discussion -
  confirmed directly in the raw transcript while preparing this entry.
quote: "I would say that we are tracking [opt-outs] quite well and at the moment, we saw a slight peak when the announcement was made when there was quite a lot of social media by Foxglove and other privacy campaigners. But the opt-out level has not really materialised as much as we feared. We've also done quite a lot of work with our frequently asked questions so that they're public facing and have tested that with our external stakeholder groups so that they've helped us shape the messages so that people can actually understand that for direct care, it's not in their interest to opt out, obviously they can, but it's unlikely."
