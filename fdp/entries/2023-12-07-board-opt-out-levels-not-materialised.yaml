title: Board told opt-out rate after FDP award "has not really materialised as much as we feared"
summary: >-
  Asked by a board member what the impact on care would be for patients who
  opt out of data sharing, Ming Tang told the board that opt-outs saw "a
  slight peak" around the FDP award announcement, driven by social media
  activity from Foxglove and other privacy campaigners, but that the
  opt-out rate had not risen as much as NHS England had feared. This is the
  same meeting referenced in the spec's caption-reliability note: the
  auto-captions render "opt-outs" as "ops out" partway through this
  exchange, while rendering it correctly elsewhere in the same discussion -
  confirmed directly in the raw transcript while preparing this entry.
quote: "I would say that we are tracking [opt-outs] quite well and at the moment, we saw a slight peak when the announcement was made when there was quite a lot of social media by Foxglove and other privacy campaigners. But the opt-out level has not really materialised as much as we feared."
