contested: >-
  The `source_url`/`archive_url` point at the DPIA's publication page,
  which returned a JavaScript-interstitial page on direct fetch rather
  than readable content; the PDF itself
  (https://web.archive.org/web/20261013190514/https://www.england.nhs.uk/wp-content/uploads/2025/06/fdp-dia-optica-acute.pdf)
  is the actual source for the claims in this entry. The absence of a
  named SRO, CSO, or clinical safety case is based on the DPIA plus the
  sampled Check and Challenge Group minutes and the product and privacy
  notice pages - not an exhaustive search of North Tees and Hartlepool's
  own board papers and IG registers. The Information Asset/Product Owner
  name and a second author name are visibly redacted (black box) on the
  document's first page, but both remain present in the PDF's text layer;
  neither is reproduced here, consistent with the equivalent finding in
  the Cancer 360 entry.
