title: National Data Guardian sets out early advice on public trust ahead of FDP procurement
summary: >-
  Months before the FDP went out to competitive procurement, National Data
  Guardian Dr Nicola Byrne published a blog setting out her position on the
  programme: strong support for its ambitions, alongside a warning that its
  success would depend on public and professional trust. Key points included
  that trust can only be earned through a commitment to honesty and
  transparency, that there must be "no surprises" for people about how their
  information is used, that plans need to adapt to what patients and
  professionals say, and that the programme should remain mindful of the
  NHS's core values and how any procured supplier's own values align with
  them.
