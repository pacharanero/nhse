contested: >-
  Quote is from Phil Booth of the patient-data campaign group
  MedConfidential, commenting on the plans - not a denial from NHS
  England. The nine commercial models and cost estimates were explicitly
  framed in the source documents as discussion points for the day, not
  official government policy.
