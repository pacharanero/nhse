contested: >-
  The article calls Bartlett "independent" throughout and quotes him
  rebutting Palantir's critics at length, while also stating in passing
  that he was "until last month" - i.e. until approximately April 2026,
  around the same time as his debut LinkedIn post as "an independent
  voice" (see 2026-04-13-tom-bartlett-leaves-nhse-launches-independent-voice)
  - "a consultant on the project." Those two framings sit uneasily
  together: the piece does not say who paid for that consultancy work,
  only that he "has not been paid by Palantir" specifically, and does
  not explore whether his advocacy began before or after that
  consultancy ended. This repo has not independently established the
  payer, dates, or terms of the consultancy referenced.
