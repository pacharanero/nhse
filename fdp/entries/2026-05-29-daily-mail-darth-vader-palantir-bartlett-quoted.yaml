title: "Daily Mail profile defending Palantir describes Tom Bartlett as a recent FDP consultant, not just a former NHS England employee"
summary: >-
  A long Daily Mail feature defending Palantir's NHS role, by deputy
  investigations editor Miles Dilworth, quoted Tom Bartlett extensively
  as an independent, unpaid-by-Palantir voice rebutting claims the
  company could access patient data - but described him in its own
  words as someone "who until last month was a consultant on the
  project," not simply a former NHS England employee speaking six weeks
  after leaving. Bartlett told the paper the FDP data is owned by the
  NHS, that there was never pressure from Palantir to access it during
  his time on the project, and that Palantir "doesn't make it any
  easier or more difficult" for government to use the platform for
  immigration enforcement. He also criticised Green Party leader Zack
  Polanski's viral anti-Palantir video as "seems designed to scare
  people," and the Good Law Project's opt-out advice as "directed
  people toward a mechanism that harms research while achieving
  nothing."
quote: "Bartlett, who is independent and has not been paid by Palantir, told the Daily Mail the data is owned by the NHS and during his time working on the FDP there was never pressure from Palantir to access it."
