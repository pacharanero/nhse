title: openDemocracy reports NHS England created over 300 processing purposes in the COVID-19 Data Store
summary: >-
  openDemocracy reported that NHS England had created more than 300
  distinct processing "purposes" within the COVID-19 Data Store's
  Palantir Foundry installation, each governing a different slice of
  access via Foundry's Purpose-Based Access Control feature, with some
  records shared with private-sector consultancies. The figure traces to
  a written parliamentary question from Lord Hunt of Kings Heath asking
  for "the complete list of 'Purposes' currently active," which the
  Department of Health and Social Care answered by attaching a spreadsheet
  too large to publish inline rather than stating a number; a follow-up
  question asked how many users had access under each purpose. openDemocracy's
  own count of that spreadsheet puts the total above 300; this repo has not
  independently downloaded and re-derived that figure from the spreadsheet
  itself.
source_url: https://www.opendemocracy.net/en/palantir-nhs-covid-datastore-foundry-peter-thiel/
