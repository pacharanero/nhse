title: Palantir's influencer campaign contacts the doctors' group suing over the FDP's legal basis
summary: >-
  Foxglove's news round-up reported that Palantir's influencer-campaign
  partner Topham Guerin had contacted the Doctors' Association UK (DAUK)
  about countering criticism of Palantir's NHS fitness, apparently
  without realising DAUK was itself one of the organisations behind the
  legal challenge to the FDP's legal basis launched the previous month.
  NHS England told Bloomberg it was investigating whether the campaign
  breached a contract clause barring Palantir from making NHS-related
  press or marketing statements without consent - a clause the heavily
  redacted public contract text still shows exists, even though the
  surrounding "protection of personal data" section is almost entirely
  blacked out.
