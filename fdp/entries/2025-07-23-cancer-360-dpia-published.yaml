contested: >-
  The absence of a named SRO, CSO, or clinical safety case is based on
  the DPIA itself plus three sampled Check and Challenge Group minutes,
  the product catalogue, the privacy notice, and the NHS England case
  study - not an exhaustive search of Chelsea and Westminster's or
  Salisbury's own board papers and IG registers, where a locally
  completed, trust-specific copy of this DPIA or a separate safety case
  might exist but wasn't found in what was checked here. Separately, a
  near-duplicate privacy notice page exists at a "-2" suffixed URL
  (last updated 12 August 2024, versus 16 July 2025 on the canonical
  page) with otherwise identical wording; most likely a CMS artefact
  rather than evidence of a materially different earlier version - no
  Wayback capture of either page predates May 2025, so this doesn't
  reach back to December 2023.
