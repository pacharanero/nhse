title: Register reveals Swindells' Palantir-linked consultancy role as FDP procurement is delayed a second time
summary: >-
  The Register reported that NHS England's Federated Data Platform
  procurement - by then priced at up to £360m, up from the £240m
  estimated at its April 2022 launch - had been delayed for a second
  time, with the contract notice missing a promised 6 September 2022
  publication date amid the change of prime minister, and awaiting
  sign-off from incoming health secretary Thérèse Coffey. The paper also
  revealed that Matthew Swindells, NHS England's national director for
  operations and information until July 2019, joined Palantir client
  Global Counsel as a consultant that September, two months after
  leaving - inside the six-month gap civil service rules are meant to
  require between leaving public service and starting lobbying work,
  which NHS England confirmed to the Register would have applied to him -
  and that Chelsea and Westminster Hospital, where Swindells chairs the
  board, had since minuted that he be excluded from any decision-making
  regarding Palantir. The Register also found that a Palantir white paper
  on a "federated" national data infrastructure, released via a December
  2021 webinar that Global Counsel co-hosted and Swindells chaired, used
  strikingly similar language to NHS England's own data strategy,
  published six months later in June 2022.
quote: "a logically federated, locally controlled cloud-based data infrastructure"
