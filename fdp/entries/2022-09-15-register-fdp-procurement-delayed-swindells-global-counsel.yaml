contested: >-
  NHS England and NHS Improvement told the Register it engaged a range of
  stakeholders including the wider health and care system, industry and
  academics, and that the federated approach was its own recommendation,
  not adopted from Palantir's white paper. Swindells' consultancy work is
  not alleged here to have breached the six-month rule; the Register
  states only that NHS England confirmed the rule would have applied to
  him, and that questions about any contact with officials during that
  window were awaiting an official response at publication.
