contested: >-
  Facebook disputed that the harvesting constituted a "data breach," saying
  Kogan "gained access to this information in a legitimate way and through
  the proper channels" but violated its rules by passing data to third
  parties. Cambridge Analytica CEO Alexander Nix told a UK parliamentary
  inquiry in February 2018 "we do not work with Facebook data and we do not
  have Facebook data," a claim the Guardian's evidence and Wylie's
  subsequent testimony directly contradicted.
