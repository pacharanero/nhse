contested: >-
  Bartlett's classification of the NDG's evidence as manipulation is his
  analysis, not an independently established finding. His article acknowledges
  that the NDG strongly supported the FDP programme and did not recommend a
  particular contractual outcome, but argues that her evidence was selective
  and insufficient. No response from the NDG to Bartlett's article was
  identified at the time this entry was added.
