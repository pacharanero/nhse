title: Foxglove, Just Treatment, DAUK and National Pensioners Convention launch legal action against £330m FDP award
summary: >-
  One week after the Federated Data Platform contract was awarded to
  Palantir, Foxglove - together with Just Treatment, the Doctors'
  Association UK and the National Pensioners Convention - launched legal
  action arguing there was no legal basis for the £330m award.
quote: "Together with our partners Just Treatment, the Doctors' Association UK and the National Pensioners Convention we have launched legal action challenging the £330m NHS Federated Data Platform (FDP)."
