title: NHSX enlists Microsoft, Palantir and Google to build COVID-19 Data Store
summary: >-
  NHSX brought in Microsoft, Palantir Technologies UK and Google to build a
  data store to support the pandemic response, integrating data from sources
  including 999 calls, hospital occupancy and testing. Amazon Web Services
  joined shortly after, hosting Palantir's Foundry software.
