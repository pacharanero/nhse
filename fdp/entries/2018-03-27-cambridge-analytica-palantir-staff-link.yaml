contested: >-
  Palantir initially said in a statement it had "never had a relationship
  with Cambridge Analytica, nor have we ever worked on any Cambridge
  Analytica data." Hours later, after Chmieliauskas was named, Palantir
  revised its account: "We learned today that an employee, in 2013-2014,
  engaged in an entirely personal capacity with people associated with
  Cambridge Analytica. We are looking into this and will take the
  appropriate action," and said it knew of no other employees involved -
  contradicting Wylie's testimony that multiple Palantir staff took part.
  Separately, Cambridge University said it received a signed legal
  assurance from Aleksandr Kogan that no university data, models or
  software had been or would be used for the benefit of SCL, and that an
  internal dispute over intellectual property was reviewed by external
  lawyers.
