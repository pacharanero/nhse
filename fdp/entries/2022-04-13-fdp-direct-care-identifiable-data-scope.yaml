contested: >-
  This establishes direct care as an FDP use by April 2022, not as the
  platform's primary purpose or as a lawful basis. The market-engagement
  documents did not identify UK GDPR conditions, a common-law
  confidentiality route, opt-out rules, GP-data scope, or formal
  controller/processor roles. Their requirements were explicitly
  provisional. The related Q&A's description of FDP access as being for
  "operational and internal analysis purposes only" is in tension with
  the deck's direct-care read/write access unless "operational" included
  direct care; the documents do not define it. The official notice archives
  the consultation route rather than the attachments, so exact file hashes
  and the passages relied on are retained in
  `fdp/sources/2022-04-13-fdp-market-engagement-evidence.md`.
