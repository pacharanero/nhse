title: NHS England supplier deck includes direct care and identifiable data in FDP scope
summary: >-
  NHS England's supplier briefing described direct care as one of four
  proposed FDP data uses, alongside population health and proactive care,
  planning and service improvement, and research and innovation. Direct
  care required real-time read/write access and identifiable data; planning
  data "must not be identifiable"; and research would normally use
  anonymised data, with re-identifiable data contemplated for trial
  recruitment and follow-up through links to separate Trusted Research
  Environments. The deck said these uses were rooted in linked person-level
  data and mapped vaccination, elective recovery and care coordination to
  direct care. It also projected £3.6bn of benefits over ten years and
  estimated £360m for the core platform lot plus £10m for privacy-enhancing
  technology.
quote: "Must be identifiable"
quote_verified: document
source_url: https://www.find-tender.service.gov.uk/Notice/009960-2022
source_title: "NHS England: FDP supplier briefing deck, circulated through the pre-market consultation linked by Find a Tender notice 2022/S 000-009960"
archive_url: https://web.archive.org/web/20220413220336/https://www.find-tender.service.gov.uk/Notice/009960-2022
