contested: >-
  DAUK's letter itself (published on its own site, not independently
  archivable here - see "Styling"/R17 pattern in CONTRIBUTING.md for why)
  frames this as a consent and transparency concern, not a direct-care
  classification dispute specifically; this entry draws the "operational
  vs direct care" contrast from the dates and the DHSC quote alone, not
  from any claim DAUK itself made about legal basis wording.
