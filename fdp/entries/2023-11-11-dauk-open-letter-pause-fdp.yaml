title: Doctors' Association UK's open letter asks ministers to pause the FDP deal
summary: >-
  The Doctors' Association UK (DAUK) published an open letter to health
  secretary Steve Barclay, signed by 149 doctors including former Royal
  College of Physicians chair Sir Richard Thompson and BMA board member
  Dr Helen Salisbury, asking the government to "pause" the still-unawarded
  Federated Data Platform deal pending "proper scrutiny." DAUK spokesperson
  Dr David Nicholl said the plan for what he called an "enforced opt-in"
  - patients automatically included unless they actively withdraw - meant
  "basic issues of informed consent are being ignored." Asked to respond,
  a Department of Health and Social Care spokesperson described the FDP's
  purpose entirely in operational terms: it "will be used to connect
  existing data to help local health teams better prioritise waiting
  lists, manage theatre capacity and identify their staffing needs,"
  with no mention of direct care. Ten days later, at the 21 November
  2023 contract award, NHS England's own framing had changed to describe
  FDP data as being used for "direct care and planning."
quote: "We saw during the pandemic how joined-up data can be used to improve the way the NHS provides care. That's why the NHS is currently conducting a procurement process for a supplier of the Federated Data Platform (FDP), which will be used to connect existing data to help local health teams better prioritise waiting lists, manage theatre capacity and identify their staffing needs."
