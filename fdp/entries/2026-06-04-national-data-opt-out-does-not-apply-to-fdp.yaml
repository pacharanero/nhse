title: Government confirms the National Data Opt-Out does not apply to FDP products
summary: >-
  In a written parliamentary answer to Labour MP Neil Duncan-Jordan, health
  minister Preet Kaur Gill confirmed that the National Data Opt-Out - the
  mechanism most patients understand as "the" NHS data opt-out - does not
  currently apply to products used in the FDP, because the data is
  classified as being used for direct care rather than the secondary uses
  (planning, research) the opt-out covers. Patients retain a general right
  under UK GDPR Article 21 to object to processing. Separately, in answer
  to a written question from Labour MP Rachael Maskell the same month, Gill
  confirmed NHS trusts - as institutions, not patients - can decline to use
  the FDP and "procure locally" an alternative instead, provided it meets
  applicable standards.
quote: "The National Data Opt-Out does not currently apply to products used in the NHS FDP. In most cases, this is because data is being used for the purpose of direct care."
