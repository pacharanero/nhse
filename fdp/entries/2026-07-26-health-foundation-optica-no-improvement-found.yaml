contested: >-
  Palantir said the Health Foundation's report "appears to misunderstand
  what the tool does." Separately, and in the other direction, critics -
  including Steve Black, a healthcare consultant and former NHS data
  scientist - told the Financial Times that NHS England's own claimed
  reduction was itself a selective analysis, since the underlying figure
  NHS England gave the FT was restricted to long-stay discharges only (the
  tool being "mainly designed to support the management of complex
  patients") rather than discharge delays overall: "It is dangerous to
  selectively quote evidence like that because its success should be
  judged against fixing the underlying problem, which is how do we better
  manage all discharges to free up more beds." NHS England said it had
  "engaged with the Health Foundation on its analysis of the OPTICA
  discharge tool, providing data and discussing the different approaches
  and methods used to assess impact," and had commissioned an independent
  evaluation - very likely the same Imperial College evaluation already
  noted in the OSR entry as one of OSR's required remedies, though that
  identity isn't independently confirmed here. The primary Health
  Foundation PDF and its letter to OSR could not be retrieved directly:
  both health.org.uk URLs return an Akamai bot-protection block
  (`errors.edgesuite.net`) on direct fetch, and archive.org's `/save/`
  returned HTTP 520 against the Health Foundation landing page on two
  attempts - the same pattern as the WhatDoTheyKnow block already
  documented elsewhere in this repo. The landing page text, retrieved via
  a different fetch path, is retained at
  fdp/sources/2026-07-26-health-foundation-optica-analysis-landing-page.md
  per the established fallback convention. The BMJ's own report on this
  finding (bmj-2026-100485) is paywalled and not used as a source here;
  Novara Media's account is used instead, per the paywalled-source
  handling policy in spec/fdp-timeline.md.
