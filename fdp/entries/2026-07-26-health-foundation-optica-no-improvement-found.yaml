title: Health Foundation analysis finds "no notable improvement" in OPTICA discharge delays
summary: >-
  The Health Foundation, an independent health policy charity, published a
  descriptive analysis (retained at
  fdp/sources/2026-07-26-health-foundation-optica-analysis-landing-page.md,
  see `contested`) of the relationship between NHS trusts adopting OPTICA
  (the FDP's discharge-planning product) and their delayed-discharge figures,
  alongside a letter to the Office for Statistics Regulation's Director
  General, dated 22 July 2026 - the same date as the OSR casework findings
  already in this repo
  (2026-07-22-osr-finds-nhse-fdp-causality-claims-needed-caveat), though it
  isn't established here whether the letter preceded, accompanied, or
  responded to that casework. Trusts using OPTICA saw "no notable
  improvement" in cutting delays, contradicting NHS England's own
  platform-wide claim - stated on the current product catalogue page as a
  "14.9% decrease in average number of delay days for patients staying in
  hospital for more than 7 days after rolling out OPTICA" (see
  2024-11-15-optica-acute-dpia-published) - and distinct from the 36%
  figure publicised from the original North Tees and Hartlepool pilot in
  August 2023, which concerned long-stay (21+ day) admissions specifically
  at that one trust.
