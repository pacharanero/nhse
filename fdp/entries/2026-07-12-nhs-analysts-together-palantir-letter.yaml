title: Over 100 NHS data and digital staff sign open letter calling to end Palantir partnership
summary: >-
  NHS Analysts Together, a group of NHS data and digital professionals,
  sent an open letter signed by over 100 colleagues - from senior analysts
  to data scientists to operational experts, working locally, regionally
  and nationally - to senior leadership at NHS England and DHSC, calling
  for the Palantir technology partnership to end. The signatories
  described themselves as NHS data and digital professionals working
  across Integrated Care Boards, NHS Trusts, Commissioning Support Units
  and primary care, who "build, maintain, interrogate and interpret the
  data systems that underpin clinical decision making, service planning,
  population health management and operational efficiency across the
  NHS," and cited the NHS Constitution as the prompt for their objections
  on professional, ethical and practical grounds.
source_url: https://nhsdataanalyststogether.substack.com/p/over-100-digital-data-and-tech-staff
