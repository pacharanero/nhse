title: BMJ reports a third of "live" FDP trusts had not logged into its apps for a year
summary: >-
  The BMJ reported that FOI data showed roughly a third of the 139 NHS
  trusts officially counted as "live" with the FDP appeared not to have
  logged into its applications in the preceding year. Officials,
  including Rob Thompson (chief digital, data and technology officer
  across DHSC and NHS England), had repeatedly cited the count of "live"
  trusts to the Health and Social Care Committee and elsewhere as
  evidence of the platform's popularity and success. The underlying FOI
  request and response, including the raw weekly trust-level usage data
  by product, are
  [published on WhatDoTheyKnow](https://www.whatdotheyknow.com/request/national_usage_statistics_for_fe_2)
  as a request to NHS England (a near-identical request to DHSC drew a
  response that DHSC does not hold this data) - see
  2026-06-11-foi-fdp-weekly-usage-data-cost-per-login for the full
  dataset and this repo's own cost-per-login calculation from it.
quote: "Rob Thompson, for example, chief digital, data, and technology officer across the Department of Health and Social Care and NHS England, told the Commons' Health and Social Care Committee last month that this metric indicated the FDP's popularity among trusts."
