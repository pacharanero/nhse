title: Good Law Project exposes covert Palantir-funded influencer campaign against it
summary: >-
  Good Law Project revealed that Palantir and Tory-linked PR agency Topham
  Guerin had drawn up a plan, dated 28 November 2023 with a 22 December
  deadline, to pay social media influencers to post content defending
  Palantir's FDP contract and rebutting "misinformation" - naming Good Law
  Project specifically as the source of that "misinformation" in the
  briefing document. Marketing agency Disrupt approached would-be
  influencers without initially naming Palantir or Topham Guerin;
  Dr Julia Patterson, founder of EveryDoctor (a co-signatory, with Good Law
  Project, of the "No Palantir In Our NHS" campaign), was among those
  approached, recognised the campaign's target, and forwarded the
  correspondence and briefing document to Good Law Project. Influencers
  who expressed interest were sent a document headed "TG x Palantir" and
  told to "keep the brand confidential and not tag Palantir" when
  publishing content, and to "refrain from mentioning the brand" if
  responding to comments.

  Four days later, Good Law Project reported that NHS England had
  confirmed to Bloomberg UK it would investigate whether the campaign
  breached the FDP contract's "Publicity and Branding" clause (Section
  24), which bars Palantir from using NHS England's name or brand in any
  marketing or promotion without its prior written consent - consent
  Palantir had not sought. Palantir's EVP for UK and Europe, Louis Mosley,
  told Bloomberg the campaign was an "exploratory project" that was "not
  pursue[d]," so "the campaign was not discussed with NHS England." No
  public resolution of NHS England's investigation has been found as of
  this entry.
quote: "Palantir is not - and frankly never has been - a company that can be trusted with this nationally important contract with our NHS. By its own behaviour it is telling us exactly that."
