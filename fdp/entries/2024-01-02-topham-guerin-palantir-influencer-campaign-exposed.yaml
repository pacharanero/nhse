contested: >-
  Palantir's only recorded response (via EVP Louis Mosley, to Bloomberg) is
  that the campaign was an unpursued "exploratory project," which does not
  directly address Good Law Project's documentary evidence that campaign
  materials specified a firm December 2023 deadline and told influencers
  to conceal the Palantir connection - findings consistent with a real,
  live campaign rather than an abandoned exploratory one. The quote
  attributed to Good Law Project's Executive Director, Jo Maugham, is
  reproduced in full, including the second sentence not shown above:
  "Within weeks, it commissioned a covert smear campaign against a
  prominent critic and appears to have broken the terms of that contract.
  If this Government won't act to protect the national interest, the next
  one must." The 6 January follow-up
  (https://web.archive.org/web/20261013222932/https://goodlawproject.org/nhs-to-investigate-palantir-influencer-campaign-as-possible-contract-breach/)
  is the source for the NHS England investigation and Mosley quote; it is
  not separately entered here as the facts are tightly coupled to the
  same four-day story. Bloomberg UK's own report (5 January 2024) is
  behind a gift-link in Good Law Project's piece and not independently
  verified here.
