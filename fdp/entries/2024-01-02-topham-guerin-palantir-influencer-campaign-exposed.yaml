contested: >-
  Good Law Project characterised the material as a covert paid campaign
  commissioned by Palantir. Its 2 January follow-up
  (https://web.archive.org/web/20261013222905/https://goodlawproject.org/how-palantir-and-topham-guerins-plan-to-discredit-us-unravelled/)
  identified Disrupt as the marketing agency that contacted potential
  influencers and Dr Julia Patterson of EveryDoctor as one recipient who
  passed the material to Good Law Project. The article says Palantir,
  Topham Guerin and Disrupt were approached for comment but records no
  response from them. On 6 January, NHS England told Bloomberg it was
  investigating whether the campaign breached the FDP contract's publicity
  clause. Palantir's UK and Europe EVP, Louis Mosley, said it was an
  exploratory project that the company decided not to pursue and therefore
  did not discuss with NHS England. Good Law Project's follow-up
  (https://web.archive.org/web/20261013222932/https://goodlawproject.org/nhs-to-investigate-palantir-influencer-campaign-as-possible-contract-breach/)
  is the source for NHS England's investigation and Mosley's response; it
  is not separately entered because it is a direct development in the same
  event. Bloomberg UK's 5 January report is behind a gift link in Good Law
  Project's piece and was not independently verified here. No public
  resolution of NHS England's investigation has been found as of 16
  October 2026.
