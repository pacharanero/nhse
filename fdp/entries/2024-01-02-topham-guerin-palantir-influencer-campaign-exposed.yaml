title: Good Law Project publishes Palantir influencer-campaign documents
summary: >-
  Good Law Project published emails and a Topham Guerin-branded briefing
  for a proposed social media campaign about Palantir's FDP contract. The
  material asked potential influencers for their fee expectations for two
  posts, identified Good Law Project as the target of a rebuttal to alleged
  misinformation, set content to go live before the new year, and told
  participants to keep Palantir confidential and not tag or mention it.
quote: "When the content is posted, please keep the brand confidential and not tag Palantir."
quote_verified: document
source_url: https://goodlawproject.org/pr-firm-topham-guerin-tories-and-palantir-offers-to-pay-influencers-attacks-twitter-x/
source_title: "Good Law Project: PR firm that works for the Tories and Palantir offers to pay for attacks on us"
archive_url: https://web.archive.org/web/20231222081947/https://goodlawproject.org/pr-firm-topham-guerin-tories-and-palantir-offers-to-pay-influencers-attacks-twitter-x/
