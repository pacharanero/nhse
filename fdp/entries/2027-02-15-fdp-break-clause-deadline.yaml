title: FDP contract's initial three-year commitment ends - break clause point
summary: >-
  The FDP and Associated Services contract's initial three-year commitment
  ends on 15 February 2027, the point at which the government can exercise
  the contract's break clause rather than continue into further option
  years of the up-to-seven-year, up-to-£330m deal. This is a scheduled
  contractual date, not yet a past event - recorded here as the timeline's
  current endpoint, per the spec's framing of the break clause as "the
  timeline's endpoint and its reason for existing." Multiple parliamentary
  and campaign sources through 2026 treat this as the decision point,
  though none found so far specify whether the government must act by
  15 February 2027 itself or whether the date marks contract-term expiry
  with some decision lead time before it. The [published
  contract](https://www.contractsfinder.service.gov.uk/Notice/Attachment/dbd3c42f-2d7f-4419-8ec2-a5091015eadb)
  also allows NHS England to require up to 24 months of termination
  assistance, with a possible six-month extension, including continued
  services, transfer support, tender due-diligence information and an
  implementable exit plan.
quote: "The initial three-year commitment ends on 15 February 2027."
