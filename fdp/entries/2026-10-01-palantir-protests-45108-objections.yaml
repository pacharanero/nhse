title: Coordinated protest day and 45,108 GDPR objections target Palantir's NHS role
summary: >-
  Dozens of protests took place outside NHS offices and hospitals across
  England on 1 October 2026, culminating in a rally outside Palantir's
  London headquarters, demanding the government end the FDP contract.
  Separately, a legal objection citing GDPR principles and signed by
  45,108 members of the public was submitted to NHS England, calling for
  their health data to be protected from Palantir. 38 Degrees separately
  reported handing in 295,348 petition signatures to Downing Street the
  same day. The protests prompted Palantir-associated peer Tom Watson to
  publicly defend the company in a BBC Radio 4 interview the following
  week, accusing critics of
  ["mob rule"](https://www.bbc.co.uk/sounds/play/m0032qly).
quote: "A wave of protests over US tech giant Palantir's involvement in the NHS have been held across England."
