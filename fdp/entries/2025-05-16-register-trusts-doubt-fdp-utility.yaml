contested: >-
  Leeds Teaching Hospitals' own spokesperson response, quoted in the same
  piece, is more measured than the leaked letter: they said they were
  "currently working with the FDP team to implement" the RTT validation
  product specifically, while continuing to use their existing
  outpatient-coordination and discharge-planning services "whilst working
  closely with the FDP team... and explore new functionality" - i.e.
  qualified, product-by-product engagement rather than a blanket
  rejection. The Register cites an earlier Democracy for Sale piece
  (https://democracyforsale.substack.com/p/palantirs-nhs-data-platform-rejected-hospitals)
  for the Greater Manchester and Berkshire Healthcare quotes, not yet
  independently checked or added as its own entry here - it would predate
  this repo's existing 14 July 2026 Democracy for Sale/LRB entry by well
  over a year and may be worth its own entry if chased down.
