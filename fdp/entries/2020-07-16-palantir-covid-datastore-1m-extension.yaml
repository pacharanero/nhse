title: Palantir's £1 COVID-19 Data Store contract extended by £1m
summary: >-
  As its original term expired, Palantir's contract to work on the NHS
  COVID-19 Data Store was extended for four months at a cost of £1m,
  moving the engagement beyond its original nominal fee.
