contested: >-
  The four published pages end with "Yours sincerely," but show no name or
  signature, so this entry records Watson as the publisher rather than the
  author. Archive.org returned HTTP 523 when asked to capture the X post; the
  post text, complete transcription and four original images are therefore
  retained in fdp/sources. No response from the NDG to this letter was
  identified at the time this entry was added.

  Interpretive note: read alongside Watson's 10 October "mob rule" interview
  and Bartlett's 15 October article, the shift from defending the contract to
  alleging institutional capture may suggest increasing desperation in the
  public defence of the FDP. That is an interpretation of the escalating
  public rhetoric, not evidence of either person's motive or of Palantir's
  internal state.
