title: Tom Watson publishes Palantir letter accusing NDG of campaign-group capture
summary: >-
  Palantir UK senior vice-president Tom Watson published four images of a
  Palantir Technologies letter dated 12 October to health innovation minister
  James Frith. The letter agreed with the National Data Guardian's three
  recommendations but disputed her supporting evidence, alleged that she
  appeared to have been "captured by campaign groups", challenged the weight
  given to campaign correspondence, an Ekō-commissioned poll, opt-out rates and
  an NHS data professionals' letter, and cited supplier uptake and benefit
  figures in response. The NDG's letter did not recommend a particular
  contractual outcome and described public and professional trust as relevant
  to the FDP regardless of which supplier was chosen.
quote: "Sadly the National Data Guardian appears to have been captured by campaign groups that have zero interest in building trust and every interest in stoking fear, and, as a result, this intervention fails to contribute to it."
quote_verified: document
source_url: https://x.com/tom_watson/status/2111102180082200717
source_title: "Tom Watson on X: Palantir response to the National Data Guardian's FDP letter"
