title: Foxglove and openDemocracy launch judicial review over Palantir COVID-19 Data Store deal
summary: >-
  Foxglove supported openDemocracy in launching a judicial review claim
  against the government over its failure to consult the public before
  handing Palantir its December 2020 two-year, up to £23.5m contract to
  continue running the COVID-19 Data Store.
quote: "In February, Foxglove supported openDemocracy to launch legal action over the government's failure to consult the public before handing a massive new contract to US tech corporation Palantir."
