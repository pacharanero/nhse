contested: >-
  The Department for International Trade told the Bureau: "There is a
  robust process in place to ensure all necessary due diligence is
  undertaken on all government contracts." NHSX and NHS England declined
  to comment when contacted by the Bureau; Palantir did not respond to a
  request for comment.
