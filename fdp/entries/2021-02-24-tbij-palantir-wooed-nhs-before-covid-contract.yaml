title: Bureau of Investigative Journalism reveals Palantir courted NHS England for months before its emergency COVID contract
summary: >-
  Leaked emails obtained by the Bureau of Investigative Journalism,
  published in partnership with Sky News, showed Palantir's UK boss Louis
  Mosley had been courting NHS England chair Lord David Prior since a
  dinner on 2 July 2019, offering software demonstrations in San
  Francisco and at the World Economic Forum in Davos, months before the
  company was handed a nominal £1 emergency contract in March 2020 to
  build the COVID-19 Data Store. By January 2020, the Department for
  International Trade was discussing how to support the company's growth
  in the UK - including help with recruitment, office space and visas -
  and Palantir's London team, by then around 600 strong, was already
  developing a product focused exclusively on the UK healthcare market,
  two months before the pandemic created any emergency to respond to.
quote: "If you can see ways where you could help us structure and curate our data so that it helps us deliver better care and provides a more insightful data base for medical research do be in touch."
