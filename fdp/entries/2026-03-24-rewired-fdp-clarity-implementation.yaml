title: Rewired panel calls for clearer FDP roadmap and local implementation support
summary: >-
  At Digital Health Rewired, NHS data leaders discussed unresolved
  primary-care scope, central ambiguity, risk aversion, local resourcing
  and practical use cases. Kavitha Saravanakumar asked NHS England for a
  clearer roadmap and said local organisations lacked resources to
  implement and support the platform; Will Monaghan described local value
  from FDP data warehousing but said central politics and risk aversion
  impeded progress; Marc Farr argued for greater focus on routine
  automation. Digital Health reported its own event and later published a
  [session recording](https://www.youtube.com/watch?v=S6Y1Ul8sIxE).
