title: NHS England defines FDP's five use cases and excludes GP data
summary: >-
  Alongside the contract award, NHS England set out the FDP's scope: five
  use cases (population health and person insight, care coordination,
  supply chain, vaccination and immunisation, and elective recovery), a
  statement that no company involved can access health and care data
  without explicit NHS permission, that data within the platform is used
  only for direct care and planning rather than research, and that GP data
  "will not feed into the national version of the software platform."
quote: "All data within the platform is under the control of the NHS and will only be used for direct care and planning. It will not be used to access data for research purposes and GP data will not feed into the national version of the software platform."
