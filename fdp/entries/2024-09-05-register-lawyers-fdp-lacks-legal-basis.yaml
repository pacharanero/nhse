title: Register reveals NHS England's own lawyers found the FDP's privacy tech lacks a legal basis
summary: >-
  The Register reported that FDP board documents from March 2024 showed
  NHS England had received advice from King's Counsel that the platform's
  privacy-enhancing technology (PET), supplied by IQVIA to de-identify
  personal data, "will require a separate lawful basis to process PCD
  (personal confidential data)" - and that without a fix, NHS England
  would have to let patients opt out under the Section 251 regime, with
  the board documents themselves noting "there is a risk that a Section
  251 will be required, which could result in the National Data Opt Out
  being applicable to all flows." This directly contradicted NHS
  England's own public position three months earlier: when Foxglove's
  coalition first alleged in December 2023 that the FDP lacked a lawful
  basis, an NHS spokesperson said the claim "fundamentally misunderstands
  how the Federated Data Platform will operate and is totally incorrect
  in both matters of law and fact." The Register also noted in passing
  that NHS England's "earlier definition of the FDP was to bring together
  'operational' data" - a different framing from its current position
  that Local Instances process GP-sourced confidential patient
  information "for the purposes of individual care" (i.e. direct care),
  which is also what NHS England cites as the reason the National Data
  Opt-Out does not apply to those flows.
quote: "There is a risk that a Section 251 will be required, which could result in the National Data Opt Out being applicable to all flows."
