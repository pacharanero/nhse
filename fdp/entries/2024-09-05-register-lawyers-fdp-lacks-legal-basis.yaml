contested: >-
  The reported advice concerned IQVIA's NHS-PET processing and said a
  separate basis "will be required"; it was not a finding that every FDP
  product lacked a basis. The underlying advice and board documents were
  not independently reviewed by this repo. NHS England declined to comment
  to the Register for this story. Its
  December 2023 denial of Foxglove's legal-basis concerns (quoted above)
  was not subsequently revisited in public by NHS England as far as this
  entry's source shows - only the internal board papers described here
  record the King's Counsel advice. Quote is from FDP board documents as
  quoted by the Register (quote_verified: secondary), not independently
  seen by this repo. NHS England later told Digital Health that the FDP was
  governed by a rigorous information-governance framework and that no data
  was processed without a lawful basis; Foxglove's Rosa Curling called for
  the relevant advice to be published, while IQVIA did not respond before
  publication. Re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2024/09/patients-may-be-able-to-opt-out-of-sharing-their-data-with-the-fdp/)
  on 10 September 2024; no exact archive of that report was verified.
