title: DAUK and allies launch "Back the Break Clause" campaign
summary: >-
  Doctors' Association UK, with organisations including Amnesty
  International, launched the "Back the Break Clause" campaign calling on
  the government to exercise the February 2027 break clause in the FDP
  contract, publish its revised business case, and assess alternative UK
  and European suppliers before committing further public money. The
  campaign's website lets people write to their MP, hospital, Integrated
  Care Board, and council, and includes a live tracker of organisations
  and individuals that have backed it.
quote: "The February break clause gives the Government an important opportunity to properly assess whether continuing with this contract is in the best interests of patients, clinicians and the NHS."
