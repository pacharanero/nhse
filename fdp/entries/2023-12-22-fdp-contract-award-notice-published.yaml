contested: >-
  The initial agreement itself displays 21 November 2023 as its date,
  while Contracts Finder, Find a Tender and NHS England record 22 November
  as the award, signing or start date. The notice was replaced by a
  materially different four-file publication on 21 March 2024. The UK
  Covid-19 Inquiry also preserves [a copy of the original notice and
  attachments](https://covid19.public-inquiry.uk/wp-content/uploads/2025/10/20102954/INQ000655845.pdf).
  Re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2024/01/nhse-publishes-heavily-redacted-palantir-fdp-contract/)
  on 8 January 2024; no exact archive of that report was verified.
