title: Formal Contract Award Notice for FDP-AS published, recording £182m value
summary: >-
  The statutory Contract Award Notice for the Federated Data Platform and
  Associated Services procurement was published on Contracts Finder,
  recording a contract value of £182m - a lower figure than the "up to
  £330m over seven years" and "up to £480m" figures used elsewhere,
  reflecting a different valuation basis (committed spend versus ceiling
  spend across options). The original notice published a 586-page contract
  package; [Digital Health counted 259 of 272 pages in part two and 164 of
  242 pages in part three as
  redacted](https://www.digitalhealth.net/2024/01/nhse-publishes-heavily-redacted-palantir-fdp-contract/).
  NHS England attributed the scale of redaction to the package's size and
  complexity, commercial sensitivity and data security, and said further
  material might follow.
