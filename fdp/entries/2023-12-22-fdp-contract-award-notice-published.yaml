contested: >-
  The current Contracts Finder source is the replacement notice published
  on 21 March 2024; the [original 22 December
  notice](https://www.contractsfinder.service.gov.uk/notice/2e8c61c0-faab-4f99-ae69-b00df6bae165)
  was replaced and has no verified archive capture. The UK Covid-19
  Inquiry preserves [a copy of the original notice and
  attachments](https://covid19.public-inquiry.uk/wp-content/uploads/2025/10/20102954/INQ000655845.pdf).
  Re-reported by
  [digitalhealth.net](https://www.digitalhealth.net/2024/01/nhse-publishes-heavily-redacted-palantir-fdp-contract/)
  on 8 January 2024; no exact archive of that report was verified.
