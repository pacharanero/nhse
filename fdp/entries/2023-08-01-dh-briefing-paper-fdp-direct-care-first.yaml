contested: >-
  This is the clearest and earliest documented instance found so far of
  "direct care" being named as the FDP's primary stated purpose - three
  months before the November 2023 contract award, and predating the DAUK
  entry above, whose DHSC spokesperson quote omits direct care entirely.
  That omission looks like an incomplete soundbite rather than evidence
  the "direct care first" position wasn't yet settled; this document
  shows it already was, in detail, by August 2023 at the latest.
