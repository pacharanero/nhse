title: DH briefing paper tells Parliament the FDP will support direct care "first and foremost"
summary: >-
  The Department of Health and Social Care deposited a detailed briefing
  paper on the FDP with Parliament, written explicitly to "offer
  reassurance" against concerns already raised by "parliamentarians and
  other stakeholders" about procurement fairness, data use, and value for
  money. Its "What will the data be used for?" section states "direct
  care" first, ahead of "secondary purposes" (planning, research, quality
  auditing): data used for direct care "will be required to be held in
  identifiable form," accessible only to those working on direct care
  (clinicians, bed managers, discharge coordinators), while secondary and
  national-level use would rely on de-identification, with "only very
  high-level, summary data, which is not identifiable" used nationally.
  It confirms there were "no plans to include GP data in the National FDP
  tenant" (local tenants could include it via local agreements), sets out
  four separate procurements (the core platform; privacy-enhancing
  technology; a product "Marketplace"; and product development/support),
  and cites specific pilot benefit figures without a causality caveat -
  "local trials have enabled trusts to remove up to 16% of their waiting
  list through error identification," and one discharge pilot cutting
  21-day-plus hospital stays from a 20% national average to 12% over
  twelve months - of exactly the kind the Office for Statistics
  Regulation later found needed one. It also lists eleven named trusts
  where pilots had been paused, with reasons and status as of 1 August
  2023.
quote: "First and foremost, the federated data platform will support data to be used to support the direct care of patients."
