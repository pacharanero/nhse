contested: >-
  NHS England disputes that the earlier (pre-6 June 2026) wording claimed
  causality: it told OSR the prior methodology description stated the
  figures were a before/after comparison without asserting the change was
  caused by FDP. OSR's report notes it understands why users read the
  June 2026 caveat as a substantive change in NHS England's messaging,
  without itself ruling that the earlier page was misleading.
