title: MP says opt-out exemption rests on an unpublished s.254 Health and Social Care Act direction
summary: >-
  In the Westminster Hall debate on the FDP, Iqbal Mohamed MP said patient
  data opt-outs do not apply to the platform "due to a legal direction
  issued under section 254 of the Health and Social Care Act 2012," and
  that this direction "has not been published or named or been subject to
  scrutiny." If accurate, this identifies the specific legal mechanism
  behind the opt-out exemption later confirmed in general terms by
  minister Preet Kaur Gill (see 2026-06-04 entry) - a directive power
  rather than a published policy document. Not independently verified
  against the direction itself, which this entry's source says has not
  been published; worth checking against NHS England's FDP Information
  Governance Framework and any FOI response naming the direction.
quote: "Perhaps most concerning of all are the reports that patient data opt-outs do not apply to the federated data platform due to a legal direction issued under section 254 of the Health and Social Care Act 2012, yet that direction has not been published or named or been subject to scrutiny."
