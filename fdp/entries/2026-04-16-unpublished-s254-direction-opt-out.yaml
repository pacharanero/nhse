contested: >-
  This entry records an attributed parliamentary allegation, not an
  independently verified direction. NHS England's Information Governance
  Framework lists section 254 directions as one possible route for some
  national processing, but that does not establish that a direction caused
  the current FDP-wide opt-out position.
