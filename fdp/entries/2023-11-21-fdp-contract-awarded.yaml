title: NHS England awards £330m Federated Data Platform contract to Palantir-led group
summary: >-
  NHS England announced it had awarded the Federated Data Platform and
  Associated Services contract, following an open and competitive
  procurement, to a group led by Palantir Technologies UK with Accenture,
  PwC, NECS and Carnall Farrar. The deal was described as worth up to £330m
  over seven years, with at least £25.6m of investment in the first
  contract year. The contract includes a break clause exercisable in
  February 2027. Palantir CEO Alex Karp welcomed the award (see quote).
quote: "There is no more important institution in the UK than the NHS and we are humbled to have now been chosen to provide that software across England to help bring down waiting lists, improve patient care and reduce health inequalities."
