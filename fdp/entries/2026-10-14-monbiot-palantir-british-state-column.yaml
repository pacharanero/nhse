contested: >-
  This is a Guardian opinion column, not a news report - Monbiot's own
  framing and selection of facts throughout. Palantir is not quoted
  responding to the specific Samantha Jones or Martha Dalton claims in
  this piece. Both threads rely on primary reporting (FT for Jones,
  Guardian news desk for Dalton) that this entry has not independently
  fetched or verified - flagged here as a lead rather than confirmed
  fact in this repo's own voice; worth their own dedicated, properly
  sourced entries if pursued further.
