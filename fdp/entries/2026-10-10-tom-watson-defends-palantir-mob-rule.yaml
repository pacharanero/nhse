title: Tom Watson defends Palantir against "mob rule" criticism on BBC Radio 4
summary: >-
  Nine days after the 1 October protests, Palantir peer and former Labour
  deputy leader Tom Watson appeared on BBC Radio 4's Political Thinking
  with Nick Robinson to defend the company's NHS role. The BBC titled the
  episode "Tom Watson: Don't bow to 'mob rule' on Palantir," attributing
  the phrase to Watson in response to critics of the FDP contract; this
  repo has not independently transcribed his exact wording within the
  40-minute broadcast to confirm it as verbatim. Watson, who accepted he
  was at the centre of a "media storm," also addressed criticism of
  Palantir's work with the Israel Defense Forces and faced questions over
  the efficacy of the FDP software.
