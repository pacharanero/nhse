title: Tom Watson defends Palantir against "mob rule" criticism on BBC Radio 4
summary: >-
  Nine days after the 1 October protests, Palantir senior vice-president
  and former Labour deputy leader Tom Watson appeared on BBC Radio 4's
  Political Thinking with Nick Robinson to defend the company's NHS
  role. The BBC titled the episode "Tom Watson: Don't bow to 'mob rule'
  on Palantir." Reporting the same interview a day ahead of the BBC's
  own publish date, the Guardian quoted him telling "former colleagues":
  "do you want to let the rule of law lead procurement practice, or do
  you want mob rule to lead procurement practices? Because you get
  yourself in a lot of trouble if you go down on the latter one." He
  also said Palantir would work with a Reform UK government on
  immigration crackdowns "if the situation arose," and that Palantir had
  taken a leave of absence from the House of Lords and relinquished his
  parliamentary pass for the role. Science, Innovation and Technology
  Committee chair Chi Onwurah responded that "Tom is not the first
  politician to be blinded by tech hype."
quote: "One of the things I'd say to my former colleagues is: do you want to let the rule of law lead procurement practice, or do you want mob rule to lead procurement practices? Because you get yourself in a lot of trouble if you go down on the latter one."
