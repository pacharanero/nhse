contested: >-
  This entry is built from the BMJ's free teaser only (paywalled beyond
  the first few paragraphs). The study itself records possible pandemic
  effects, partial or staggered adoption, concurrent interventions and
  uncertainty over the mechanism producing the observed change. Palantir
  executive Louis Mosley called the BMJ account "technically accurate,
  engineered to mislead"; BMJ editor in chief Kamran Abbasi said the
  limitations and inability to infer causation were clearly stated. NHS
  England did not respond in the Digital Health report. The visible BMJ
  standfirst describes the unnamed second figure as the pilot trust's
  innovation adviser who worked directly for Palantir; the available
  evidence does not support the earlier inference that this was Matthew
  Swindells. Re-reported and methodologically expanded by
  [digitalhealth.net](https://www.digitalhealth.net/2026/04/chelsea-and-westminster-fdp-success-flawed-says-bmj-article/)
  on 23 April 2026; no exact archive of that report was verified.
