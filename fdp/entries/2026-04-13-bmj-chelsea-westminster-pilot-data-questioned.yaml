contested: >-
  This entry is built from the BMJ's free teaser only (paywalled beyond
  the first few paragraphs); the specific nature of the "overstate"
  finding is not confirmed here. Chelsea and Westminster is also the
  pilot/incubator site named in this repo's Cancer 360 entry, and recurs
  as NHS England's most-cited FDP "success story" across multiple
  products. The "second figure... linked to the tech giant" is very
  likely Matthew Swindells - see
  2026-03-05-swindells-palantir-conflict-of-interest-resigns, sourced
  independently of this BMJ piece: the FT first reported his conflict of
  interest on 5 March 2026 and his resignation (effective 31 March) on
  17 March, both well before this 13 April BMJ piece, which is
  consequently likely recapping an already-public story rather than
  breaking a new one. Neither piece names the other's subject explicitly,
  so this remains a strong inference from matching trust, timing and
  subject matter rather than a direct confirmation. Separately, 13 April
  2026 is also the date of Tom Bartlett's debut "independent commentator"
  LinkedIn post - the two are not otherwise known to be connected, and
  this is noted only as a dated coincidence worth being aware of, not a
  claimed link.
