contested: >-
  This entry is built from the BMJ's free teaser only (paywalled beyond
  the first few paragraphs); the specific nature of the "overstate"
  finding, and the identity of the "second figure," are not confirmed
  here. Chelsea and Westminster is also the pilot/incubator site named in
  this repo's Cancer 360 entry, and recurs as NHS England's most-cited FDP
  "success story" across multiple products - a pattern independently
  reported in detail by Peter Geoghegan and Lucas Amin's later (23 July
  2026) London Review of Books investigation (see
  2026-07-14-democracy-for-sale-project-onion-investigation), which names
  Matthew Swindells, a Global Counsel employee from 2019, as the trust's
  co-chair until he was "forced to resign" after the FT reported he had
  privately urged colleagues to add GP data to the FDP to demonstrate its
  effectiveness. It is likely, but not confirmed by either piece directly,
  that Swindells is the "second figure" this BMJ headline refers to - this
  BMJ piece (13 April 2026) predates the LRB's account of his resignation,
  so if it is him, the BMJ appears to be the earlier public flag of the
  same conflict of interest. Separately, 13 April 2026 is also the date of
  Tom Bartlett's debut "independent commentator" LinkedIn post - the two
  are not otherwise known to be connected, and this is noted only as a
  dated coincidence worth being aware of, not a claimed link.
