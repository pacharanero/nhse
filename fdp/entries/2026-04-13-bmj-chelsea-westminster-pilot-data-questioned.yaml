title: BMJ questions Chelsea and Westminster's FDP pilot "success" data
summary: >-
  The BMJ reported that data it had seen suggested two of NHS England's
  headline claims about the FDP's benefits, both drawn from an early pilot
  at Chelsea and Westminster NHS Foundation Trust, were flawed. NHS
  England's board minutes credit a theatre management tool, piloted at the
  trust in January 2022 as part of a care coordination solution, with
  increasing theatre use; multiple sources, including a Palantir blog and
  an NHS report, separately claim FDP use at the trust cut the inpatient
  elective surgery waiting list by 28%. The piece's own headline points to
  a second, unnamed figure at the trust "linked to the tech giant," beyond
  the trust's role as a pilot site. The BMJ's teaser text is cut off before
  naming this figure or detailing the specific flaw in the two claims.
  [Digital Health later reported the methodological
  criticism](https://www.digitalhealth.net/2026/04/chelsea-and-westminster-fdp-success-flawed-says-bmj-article/):
  the 45-week baseline ended during the Omicron disruption, nearby trusts
  showed similar recovery patterns, and the observational study could not
  establish direct cause and effect.
quote: "But data seen by The BMJ suggest that two key claims regarding these pilots overstate the benefits of Palantir software."
