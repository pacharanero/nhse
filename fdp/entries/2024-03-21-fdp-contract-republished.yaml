contested: >-
  The replacement was materially less blanked but was not a uniformly
  less-redacted overlay: some wording visible in the initial agreement,
  including clause 25.3, was redacted in the replacement. The initial
  agreement displays 21 November 2023 as its date, while the replacement
  and official procurement metadata use 22 November. Replacement-file
  hashes identify verified April 2025 Wayback copies because no
  publication-day attachment captures or independent UK Government Web
  Archive copies were found. No third publication generation or later
  formal modification notice was located, which does not exclude
  unpublished change control. The seven-file inventory is retained at
  `fdp/sources/2024-03-21-fdp-as-contract-publication-versions.md`.
