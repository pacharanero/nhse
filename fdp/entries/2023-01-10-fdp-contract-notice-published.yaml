id: 2023-01-10-fdp-contract-notice-published
date: 2023-01-10
date_precision: day
category: contract
title: NHS England launches competitive procurement for FDP, worth up to £480m
summary: >-
  NHS England published the formal contract notice launching a competitive
  dialogue procurement for the Federated Data Platform and Associated
  Services (FDP-AS), to replace the COVID-19 Data Store. The notice
  estimated a 5-year contract value of up to £360m, rising to up to £480m
  with optional 12+12 month extensions.
