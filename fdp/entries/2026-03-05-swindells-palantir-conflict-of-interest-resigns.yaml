contested: >-
  Swindells denies any conflict of interest and says his proposals were
  about a local, locally-controlled version of the platform and were
  never actioned; see summary for the fuller statement. Quote and facts
  here are drawn from a paywalled FT original via a secondary summary
  (quote_verified: secondary) - [Freevacy's Privacy
  Newsfeed](https://web.archive.org/web/20261013222623/https://www.freevacy.com/news/financial-times/senior-nhs-official-lobbied-to-add-gp-data-to-fdp-while-also-advising-palantir/7180)
  for the 5 March revelation and [its summary of the 17
  March resignation
  report](https://web.archive.org/web/20261013222706/https://www.freevacy.com/news/financial-times/senior-nhs-official-who-lobbied-to-add-gp-data-to-fdp-to-step-down/7228) -
  not independently verified against the full FT text, which sits behind
  the hard paywall captured at archive_url. The BMJ's 13 April 2026 piece
  (2026-04-13-bmj-chelsea-westminster-pilot-data-questioned) refers to an
  unnamed "second figure at major trust... linked to the tech giant";
  given this resignation was already public and effective by then, this
  is very likely the same Swindells story being recapped rather than a
  new flag, though neither piece names the other's subject explicitly.
  It is not established here whether "joint chair of four... trusts" and
  the specific naming of Chelsea and Westminster in the 5 March FT
  summary refer to the same four-trust group the Daily Mail/Cancer 360
  material elsewhere in this repo associates with Chelsea and
  Westminster, or a coincidental overlap - both are consistent with the
  well-documented existence of a shared chair across a group of
  north-west London trusts.
