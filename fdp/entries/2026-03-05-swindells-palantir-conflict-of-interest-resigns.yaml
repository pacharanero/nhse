title: FT reveals Swindells pushed to add GP data to FDP while advising Palantir; resigns NHS trust chair role
summary: >-
  The Financial Times reported that Matthew Swindells, joint chair of four
  major NHS hospital trusts in north-west London (including Chelsea and
  Westminster Hospital NHS Foundation Trust), privately encouraged
  colleagues in a May 2024 email to integrate GP patient data into the
  Palantir-built FDP - despite Chelsea and Westminster's own board papers
  stating he should be excluded from any decision-making regarding
  Palantir, on account of his paid advisory role to the company, held
  through Peter Mandelson's lobbying firm Global Counsel. His email
  proposed moving aggregate metrics and, eventually, individual records
  from local GP databases into the system, suggesting this could be done
  via existing local data environments without renegotiating
  data-sharing agreements - contrary to NHS England's public statements
  that the FDP would not combine GP records nationally. Recipients of the
  email included Penny Dash, now chair of NHS England.

  Twelve days later, the FT reported that Swindells would step down from
  all four chair roles on 31 March 2026. He denied any conflict of
  interest, saying his term was ending with the trust group among the
  highest-performing in England, and separately said his email proposals
  concerned only a local version of the platform under local
  controllership, not the national system, and were never actioned.
quote: "Although board papers for Chelsea and Westminster Hospital NHS Foundation Trust stated Swindells should be excluded from any decision-making regarding Palantir, an email from May 2024 reveals he suggested flowing patient-level data into the FDP."
