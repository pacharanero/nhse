title: NHS FDP programme head says platform will continue while supplier is reviewed
summary: >-
  Digital Health reported that Nirav Patel, NHS England's head of demand
  and delivery for the FDP, wrote in a June programme bulletin that the
  platform was "here to stay" while the Palantir contract was reviewed
  for value for money, delivery performance and alignment with NHS
  priorities. Patel separated continuation of the platform from the open
  decision on whether to extend the supplier contract, and said NHS data
  remained under NHS control.
quote: "The Federated Data Platform is here to stay."
quote_verified: secondary
source_url: https://www.digitalhealth.net/2026/06/fdp-here-to-stay-says-patel-as-palantir-contract-faces-review/
source_title: "Digital Health: FDP 'here to stay' says Patel as Palantir contract faces review"
