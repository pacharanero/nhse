contested: >-
  The underlying June FDP bulletin was not located, so the quotation and
  review description are retained as secondary reporting. Patel described
  the initial term as ending in March 2027, while the published contract
  material gives 15 February 2027; this entry does not resolve that date
  discrepancy.
