id: 2021-03-30-government-concedes-palantir-jr
date: 2021-03-30
date_precision: day
category: legal
title: Government concedes judicial review, commits to public consultation before extending Palantir's NHS role
summary: >-
  Facing Foxglove and openDemocracy's judicial review over the December 2020
  Palantir COVID-19 Data Store contract, the government conceded and
  committed that Palantir would not be able to process NHS data for
  non-COVID purposes without public consultation, including citizens'
  juries, and that a data protection impact assessment would be required
  for any contract extension.
quote: "After months of insisting citizens had no right to a say in this NHS contract, the government has finally committed not to allow Palantir to start using the NHS datastore for non-Covid matters without consulting the public first."
