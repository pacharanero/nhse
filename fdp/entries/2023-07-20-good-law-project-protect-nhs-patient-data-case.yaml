title: Good Law Project seeks claimant for separate legal challenge over FDP patient opt-out rights
summary: >-
  Good Law Project launched its "Protect NHS patient data" case, seeking
  a prospective claimant to challenge whether patients can meaningfully
  opt out of having their records shared with Palantir under the
  then-unawarded Federated Data Platform contract. The campaign page
  cited a May 2022 Observer report on Virgin Care's unauthorised use of
  NHS data as a precedent for NHS data-sharing failures, and disputed NHS
  England's assurance that information shared under the contract would
  be "pseudonymous": Good Law Project argued "it's not hard to piece
  together anonymised information which could lead to patients being
  identified." This is a separate legal thread from the broader coalition
  - Foxglove, Just Treatment, DAUK and the National Pensioners Convention
  - that challenged the FDP's overall legal basis after the November 2023
  contract award.
quote: "it's not hard to piece together anonymised information which could lead to patients being identified"
