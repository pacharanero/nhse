contested: >-
  "Pseudonymous" is reported here as NHS England's position at the time,
  as characterised by Good Law Project; this entry does not independently
  verify NHS England's own wording, and the dispute over whether
  pseudonymised data can be re-identified is Good Law Project's own
  campaigning argument, not an established fact.
