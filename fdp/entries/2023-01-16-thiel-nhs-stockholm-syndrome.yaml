title: Peter Thiel tells Oxford Union British affection for NHS is "Stockholm syndrome"
summary: >-
  Speaking at the Oxford Union, Palantir co-founder and chairman Peter Thiel
  said the NHS "makes people sick" and that British people's attachment to
  it was a case of "Stockholm syndrome", arguing for privatisation and
  fewer regulations. The remarks came as Palantir was bidding for the FDP
  contract, and were reported days later by Bloomberg. Palantir said
  Thiel's comments did not reflect the company's views.
quote: "The first step is to get out of the Stockholm syndrome."
