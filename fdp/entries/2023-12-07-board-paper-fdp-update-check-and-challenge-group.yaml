title: Ming Tang's first written FDP board paper describes Check and Challenge Group, repeats uncaveated pilot benefits
summary: >-
  NHS England's board papers for its 7 December 2023 meeting included a
  dedicated written report, "Federated Data Platform update" (agenda item
  7, public session), authored by Ming Tang as Chief Data and Analytics
  Officer - the first standalone FDP board paper found in this repo's
  index of board publications. It states "[a]ll data within the platform
  is under the control of the NHS and will only be used for direct care
  and planning" and "will not be used to access data for research
  purposes," and separately that "GP data will not feed into the national
  version of the software platform" - independently corroborating, from
  NHS England's own board paper rather than trade press, the scope
  already recorded in this timeline. It describes a new "Check and
  Challenge Group" being set up with National Voices, the Patients
  Association, and the National Data Guardian "to advise the FDP
  programme and to ensure engagement with patients and clinical voices" -
  a group whose minutes this timeline already cites as a source in three
  other entries, here documented for the first time as to its own stated
  purpose and founding members. The paper also states FDP pilot benefits
  were "being realised through both the Trust Care Coordination Solution
  (CCS) and [OPTICA] pilots," linking to NHS England's own case studies,
  with no caveat about causality or independent verification - see
  `contested`.
quote: "The Federated Data Platform will provide software to link these NHS trusts and regional systems and give us a consistent technical means of linking data that is already collected for patient care... GP data will not be part of the national platform. FDP does not change data controllership arrangements so if there is data sharing agreement between integrated care system (ICS) and GPs locally to share data for care co-ordination then they can use the local version of FDP for that purpose."
quote_verified: document
