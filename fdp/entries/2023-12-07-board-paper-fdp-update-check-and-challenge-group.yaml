contested: >-
  The CCS/OPTICA benefits claim in paragraph 13 is stated as plain fact,
  with no causality or independent-verification caveat, two and a half
  years before the Office for Statistics Regulation required NHS England
  to add exactly that kind of caveat to its public benefits reporting
  (`2026-07-22-osr-finds-nhse-fdp-causality-claims-needed-caveat`) - this
  paper is an earlier, board-level instance of the same uncaveated
  pattern the OSR later found needed fixing, not something OSR examined
  directly (its casework concerned NHS England's public methodology page,
  not board papers), so this is corroborating context for the pattern
  rather than a document OSR itself ruled on.
